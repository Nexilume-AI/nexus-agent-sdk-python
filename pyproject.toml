[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "nexilume"
version = "0.49.1"
description = "Python Agent SDK for Nexus OpenWrt and hosted MCP runtimes"
readme = "README_PYPI.md"
requires-python = ">=3.9"
license = "LicenseRef-Nexus-Additional-Terms-1.0"
license-files = ["LICENSE"]
authors = [{name = "Nexus OpenWrt Team"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/Nexilume-AI/nexus-agent-sdk-python"
Documentation = "https://github.com/Nexilume-AI/nexus-agent-sdk-python/blob/main/README_GUIDE.md"
Issues = "https://github.com/Nexilume-AI/nexus-agent-sdk-python/issues"

[project.scripts]
nexus-agent = "nexus_agent.runtime_health:main"
nexus-agent-security = "nexus_agent.security_profile:main"
nexus-agent-addressd = "nexus_agent.addressd:main"
nexus-agent-addressd-service = "nexus_agent.windows_service:main"
nexus-computer = "nexus_agent.computer_runtime:main"

[project.optional-dependencies]
fastmcp = [
    "fastmcp>=3.4.7,<4", "mcp>=1.30,<2", "pydantic>=2.11.7,<3",
    "jsonschema>=4.20,<5", "uvicorn>=0.35,<1",
    "griffelib!=2.3.1; python_version < '3.11'",
]
# Keep the Nexus extra name; use FastMCP's official task dependencies.
fastmcp-tasks = [
    "fastmcp[tasks]>=3.4.7,<4", "mcp>=1.30,<2", "pydantic>=2.11.7,<3",
    "jsonschema>=4.20,<5", "uvicorn>=0.35,<1",
    "griffelib!=2.3.1; python_version < '3.11'",
]
a2a = ["a2a-sdk>=1.1,<2", "httpx>=0.28.1,<1", "protobuf>=5.29.5,<7", "pydantic>=2.11.3,<3"]
windows = ["pywin32>=306; platform_system == 'Windows'"]
# Current Playwright wheels require Python 3.10+. Do not silently select legacy browsers on 3.9.
browser = ["playwright>=1.63,<2"]
computer = [
    "websockets>=15,<16", "cryptography>=50.0.1,<51", "python-socks[asyncio]>=2.4.3,<3",
    "tomli>=2.0.1,<3; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["src"]
