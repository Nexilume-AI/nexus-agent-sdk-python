<style>
/* Wave Studio: custom presentation; all queries use the Interactive View bridge. */
body{margin:0;padding:32px;background:#102d3b;color:#e7f0f4;font:15px system-ui}h1{font-size:28px;letter-spacing:-.04em}p{color:#a3bcc9;line-height:1.7}button{background:#9bf0cf;color:#102d3b;border:0;border-radius:10px;padding:13px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#173746;padding:20px;border-radius:12px;line-height:1.6}input{padding:10px;border:1px solid #537484;border-radius:8px;background:#173746;color:white;margin:6px}label{display:block;margin-top:14px;font-size:12px}#queries{font-size:44px;color:#9bf0cf}
</style>
<header><span class="logo">∿</span><div><h1>Wave Studio</h1><p>Your signals. A clearer view.</p></div><span class="badge">● Interactive Agent workspace</span></header>
<div class="metrics"><div><small>AGENT OPERATIONS</small><div id="queries">0</div></div><div><small>SELECTED VALUE</small><div id="selected">—</div></div><div><small>TIME CURSOR</small><div id="selectedTime">—</div></div></div>
<section class="visual"><div class="sectiontitle">Signal explorer <span>LIVE DATA · MCP</span></div><div id="signalname">Run a query to explore the waveform</div><svg id="chart" viewBox="0 0 800 180" preserveAspectRatio="none" aria-label="Signal waveform"></svg><div class="slider"><small>EXPLORE TRANSITIONS</small><input type="range" id="cursor" aria-label="Time cursor" min="0" max="0" value="0" disabled></div></section>
<button id="refresh">List workspace files ↻</button>
<form id="query"><label>Session ID <input name="session_id" required></label><label>Signal path <input name="path" required></label><input name="start" value="0ns" aria-label="Start time"><input name="end" value="50ns" aria-label="End time"><button>Inspect signal</button></form>
<p id="message"></p><pre id="output">Ready for your first query.</pre>
<script>
nexus.onState(state => {document.getElementById('queries').textContent=state.metrics?.[1]?.value ?? 0;document.getElementById('output').textContent=(state.logs || []).join('\n') || 'Ready for your first query.';});
async function run(name,args,button){button.disabled=true;document.getElementById('message').textContent='Working…';try{await nexus.action(name,args);document.getElementById('message').textContent='Completed on Agent';}catch(e){document.getElementById('message').textContent=e.message;}finally{button.disabled=false;}}
document.getElementById('refresh').onclick=e=>run('refresh',{},e.target);
document.getElementById('query').onsubmit=e=>{e.preventDefault();run('query',Object.fromEntries(new FormData(e.target)),e.target.querySelector('button'));};
</script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{padding:26px;background:radial-gradient(ellipse at top right,#253e4755,transparent 60%),#10141f;color:#edf2fa;font:13px system-ui}header{display:flex;align-items:center;gap:14px;margin-bottom:22px}.logo{display:grid;place-items:center;width:44px;height:44px;background:#99f1ce;border-radius:13px;font-size:32px;color:#16382c}h1{margin:0;font-size:25px}header p{margin:3px 0;font-size:12px;color:#929eb4}.badge{margin-left:auto;font-size:10px;color:#99f1ce;border:1px solid #365848;border-radius:30px;padding:8px 12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}.metrics>div{border:1px solid #2b3345;background:#181e2c99;border-radius:12px;padding:16px 20px}small{font-size:10px;letter-spacing:1.3px;color:#929eb4}#queries,#selected,#selectedTime{font-size:28px;color:#99f1ce;letter-spacing:-1px;margin-top:6px}.visual{background:#181e2c;border:1px solid #2b3345;border-radius:14px;padding:19px 22px;margin-bottom:16px}.sectiontitle{font-size:13px;font-weight:600;display:flex;justify-content:space-between}.sectiontitle span{font:9px ui-monospace,monospace;background:#a98bfa15;color:#b9a5ff;border-radius:5px;padding:5px 8px}#signalname{font:11px ui-monospace,monospace;color:#99f1ce;margin:15px 0 3px}svg{width:100%;height:180px;display:block}.slider{display:flex;align-items:center;gap:16px}.slider input{flex:1;accent-color:#99f1ce;padding:0;margin:12px 0}#refresh{float:right;background:transparent;color:#b8c6d9;border:1px solid #38455b;font-size:11px;padding:9px 12px}form{display:grid;grid-template-columns:1fr 1.6fr .6fr .6fr auto;align-items:end;gap:10px;clear:both;padding-top:10px}label{margin:0;font-size:10px;color:#929eb4}input:not([type=range]){display:block;width:100%;margin:6px 0 0;background:#181e2c;border:1px solid #344057;border-radius:8px;font:11px ui-monospace,monospace;height:38px;color:#edf2fa}button{background:#99f1ce;border-radius:8px;padding:11px 16px;font-size:11px;font-weight:600}pre{font:11px/1.6 ui-monospace,monospace;background:#181e2c;border:1px solid #2b3345;max-height:120px;overflow:auto;margin-bottom:0}#message{font-size:11px;margin:16px 0 8px}#output:empty{display:none}@media(max-width:700px){body{padding:16px}.badge{display:none}form{grid-template-columns:1fr 1fr}form button{grid-column:1/-1}.metrics>div{padding:13px}.metrics{gap:7px}#queries,#selected,#selectedTime{font-size:23px}}
</style>
<script>
const byId=id=>document.getElementById(id);let points=[];
const pathInput=document.querySelector('[name=path]');pathInput.value='top_tb.u_counter.count';
function node(tag,attrs){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);byId('chart').append(n);return n;}
function paint(){byId('chart').replaceChildren();for(let i=0;i<5;i++)node('line',{x1:12,y1:12+i*32,x2:788,y2:12+i*32,stroke:'#2b3447','stroke-dasharray':'3 6'});if(!points.length)return;const nums=points.map(p=>p.hex==null?NaN:parseInt(p.hex,16));const max=Math.max(1,...nums.filter(Number.isFinite));const start=Number(points[0].time_units),end=Number(points.at(-1).time_units);const x=i=>14+(Number(points[i].time_units)-start)/Math.max(1,end-start)*772;const y=i=>140-(Number.isFinite(nums[i])?nums[i]/max:0)*115;let d='';points.forEach((p,i)=>{d+=i?' H '+x(i)+' V '+y(i):'M '+x(i)+' '+y(i)});node('path',{d,fill:'none',stroke:'#99f1ce','stroke-width':2.5});points.forEach((p,i)=>{node('circle',{cx:x(i),cy:y(i),r:3,fill:'#99f1ce'});const t=node('text',{x:x(i),y:170,fill:'#8290a8','font-size':10,'text-anchor':'middle'});t.textContent=p.time});const i=Number(byId('cursor').value);node('line',{x1:x(i),y1:2,x2:x(i),y2:148,stroke:'#bba4ff','stroke-dasharray':'4 4'});node('circle',{cx:x(i),cy:y(i),r:5,fill:'#bba4ff'});byId('selected').textContent=points[i].hex==null?'X':'0x'+points[i].hex.toUpperCase();byId('selectedTime').textContent=points[i].time;}
nexus.onState(state=>{for(const log of state.logs||[]){try{const data=JSON.parse(log);if(data.signals?.length){points=data.signals[0].values||[];byId('signalname').textContent=data.signals[0].path;byId('cursor').max=Math.max(0,points.length-1);byId('cursor').value=0;byId('cursor').disabled=!points.length;paint()}}catch{}}});byId('cursor').oninput=paint;paint();
</script>
