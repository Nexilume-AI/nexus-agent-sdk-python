name: SDK checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[computer,browser,fastmcp-tasks,a2a,windows]' pytest build twine
      - run: python -m pip check
      - run: python -m pytest tests -q
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/verify_artifacts.py
  core-python39:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip wheel --no-deps -w dist .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.9'
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -I -c "import nexus_agent; assert nexus_agent.__version__ == '0.48.0'"
      - run: python -I scripts/check_installation.py --extra core
  isolated-extras:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.14']
        extra: [computer, browser, fastmcp, fastmcp-tasks, a2a]
        include:
          - {os: ubuntu-latest, python: '3.9', extra: computer}
          - {os: windows-latest, python: '3.10', extra: windows}
          - {os: windows-latest, python: '3.14', extra: windows}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # Build separately: setuptools needs 3.10+, the core wheel supports 3.9.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip wheel --no-deps -w dist .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -c "import pathlib,subprocess,sys; wheel=next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install',str(wheel)+'[${{ matrix.extra }}]'])"
      - run: python -m pip check
      - run: python -I scripts/check_installation.py --extra ${{ matrix.extra }}
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_dependency_contract.py -q
      - if: matrix.extra == 'computer'
        run: python -m pytest tests/test_computer_tool_config.py -q
      - if: matrix.extra == 'browser'
        run: python -m playwright install --with-deps chromium
      - if: matrix.extra == 'browser'
        run: python -m pytest tests/test_browser.py -q
        env:
          NEXUS_REAL_BROWSER_TEST: '1'
  minimum-extras:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, extra: computer, pins: 'websockets==15.0 cryptography==50.0.1 python-socks==2.4.3 tomli==2.0.1'}
          - {os: ubuntu-latest, extra: browser, pins: 'playwright==1.63.0'}
          - {os: ubuntu-latest, extra: fastmcp, pins: 'fastmcp==3.0.0 mcp==1.24.0 pydantic==2.11.7 jsonschema==4.20.0 uvicorn==0.35.0'}
          - {os: ubuntu-latest, extra: fastmcp-tasks, pins: 'fastmcp==3.0.0 mcp==1.24.0 pydantic==2.11.7 jsonschema==4.20.0 uvicorn==0.35.0'}
          - {os: ubuntu-latest, extra: a2a, pins: 'a2a-sdk==1.1.0 httpx==0.28.1 protobuf==5.29.5 pydantic==2.11.3'}
          - {os: windows-latest, extra: windows, pins: 'pywin32==306'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - run: python -m pip install '.[${{ matrix.extra }}]' ${{ matrix.pins }}
      - run: python -m pip check
      - run: python -I scripts/check_installation.py --extra ${{ matrix.extra }}
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_dependency_contract.py -q
      - if: matrix.extra == 'computer'
        run: python -m pytest tests/test_computer_tool_config.py -q
      - if: matrix.extra == 'browser'
        run: python -m playwright install --with-deps chromium
      - if: matrix.extra == 'browser'
        run: python -m pytest tests/test_browser.py -q
        env:
          NEXUS_REAL_BROWSER_TEST: '1'
