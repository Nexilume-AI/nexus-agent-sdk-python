name: Publish to PyPI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check release tag
        run: |
          python -c "import os,tomllib; assert os.environ['GITHUB_REF_NAME'] == 'v'+tomllib.load(open('pyproject.toml','rb'))['project']['version']"
      - run: python -m pip install '.[computer,browser,fastmcp,a2a]' pytest build twine
      - run: python -m pytest tests -q
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/verify_artifacts.py
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
